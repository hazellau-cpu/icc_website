<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICC Control Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="stylesheet" href="styles.css?v=2026-11-16-3">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">I</span><span>ICC <small>(CWB)</small></span><button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Collapse sidebar" title="Collapse sidebar">‹</button></div>
      <div class="workspace-label">WORKSPACE</div>
      <nav id="nav"></nav>
      <div class="sidebar-bottom">
        <div class="sync-status"><span></span><div><strong id="workspaceMode">Workspace</strong><small id="workspaceModeDetail">Loading data source</small><small id="liveSheetsUpdate" role="status" hidden></small></div></div>
        <button class="outline-button" id="exportButton">Export workspace <span>↗</span></button>
      </div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <button class="menu-button" id="menuButton" aria-label="Toggle navigation">☰</button>
        <div class="breadcrumbs"><span>ICC (CWB)</span><b>/</b><strong id="breadcrumb">Overview</strong></div>
        <div class="top-actions"><label class="search"><span>⌕</span><input id="globalSearch" placeholder="Search workspace" aria-label="Search workspace"><kbd>⌘ K</kbd></label><button class="outline-button auth-button" id="authButton" type="button">Sign in</button></div>
      </header>
      <section class="content" id="content"></section>
    </main>
  </div>
  <div id="workspaceSaveStatus" class="workspace-save-status" role="status" aria-live="polite" hidden></div>
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="close-button" id="closeModal" aria-label="Close">×</button>
      <div class="eyebrow">NEW RECORD</div><h2 id="modalTitle">Add a record</h2>
      <form id="recordForm"><label>Record name<input name="name" required placeholder="e.g. Introduction to Python"></label><label>Collection<select name="collection" id="collectionSelect"></select></label><label>Status<select name="status"><option>Active</option><option>In progress</option><option>Draft</option></select></label><label>Notes<textarea name="notes" rows="4" placeholder="Add a short description"></textarea></label><button class="primary-button" type="submit">Create record <span>→</span></button></form>
    </div>
  </div>
  <div class="modal-backdrop" id="authBackdrop" hidden>
    <div class="modal auth-modal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <button class="close-button" id="closeAuth" aria-label="Close">×</button>
      <div class="eyebrow">ICC ACCOUNT</div><h2 id="authTitle">Sign in to ICC</h2>
      <p class="auth-help">Use an account approved for this workspace. Sign-in activity is recorded by the backend.</p>
      <div id="googleSignIn" class="google-sign-in" hidden><div id="googleSignInButton"></div><div id="googleSignInStatus" class="auth-help" role="status"></div><p class="auth-help">Or use the local demo login below.</p></div>
      <form id="authForm"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" maxlength="1024" required></label><div id="authError" class="auth-error" role="alert" hidden></div><button class="primary-button" type="submit">Sign in</button></form>
    </div>
  </div>
  <script src="icc-config.js?v=2026-11-14-1"></script>
  <script src="services.js?v=2026-11-16-2"></script>
  <script src="local-calendar-mapping.js?v=2026-11-16-1"></script>
  <script src="local-pathways.js?v=2026-11-16-1"></script>
  <script src="local-live-sheets.js?v=2026-11-16-1"></script>
  <script src="app.js?v=2026-11-16-5"></script>
</body>
</html>
